exec-once = hypridle
exec-once = swaync
exec-once = swww-daemon
exec-once = udiskie
exec-once = quickshell

exec= ~/.config/hypr/scripts/set_wallpaper.sh
exec-once = ~/.config/hypr/scripts/battery-status.sh

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE #hyprshade

exec-once = nm-applet --indicator # systray app for Network/Wifi


exec-once = [ workspace special silent ] ayugram-desktop

exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH

exec = hyprshade auto
