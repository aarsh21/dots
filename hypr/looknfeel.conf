# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    # gaps_in = 0
    # gaps_out = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8
}


windowrulev2 = float,class:(clipse) # ensure you have a floating window class set if you want this behavior
windowrulev2 = size 622 652,class:(clipse) # set the size of the window as necessary

# HyprWhisper voice dictation overlay - fully transparent floating pill
windowrulev2 = float, class:(hyprwhisper)
windowrulev2 = pin, class:(hyprwhisper)
windowrulev2 = noborder, class:(hyprwhisper)
windowrulev2 = noshadow, class:(hyprwhisper)
windowrulev2 = noblur, class:(hyprwhisper)
windowrulev2 = nodim, class:(hyprwhisper)
windowrulev2 = noanim, class:(hyprwhisper)
windowrulev2 = opaque, class:(hyprwhisper)
windowrulev2 = size 400 120, class:(hyprwhisper)
windowrulev2 = move 660 920, class:(hyprwhisper)
windowrulev2 = stayfocused, class:(hyprwhisper)
windowrulev2 = float, class:^(hyprwhspr)$
windowrulev2 = pin, class:^(hyprwhspr)$
windowrulev2 = noborder, class:^(hyprwhspr)$
windowrulev2 = noshadow, class:^(hyprwhspr)$
windowrulev2 = noanim, class:^(hyprwhspr)$
windowrulev2 = move 50% 90%, class:^(hyprwhspr)$
